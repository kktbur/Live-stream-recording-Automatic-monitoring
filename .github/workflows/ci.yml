name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      upload_artifact:
        description: Upload the installer as a release-candidate artifact.
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: Optional ref to build when called by the release workflow.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-self-check:
    name: Test, build, and self-check
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen
      FFMPEG_ARCHIVE_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-28-17-08/ffmpeg-n9.0.1-11-ge47273f4d9-win64-lgpl-shared-9.0.zip
      FFMPEG_ARCHIVE_SHA256: 9076e7ae97240a704a3c59d26401986ae29c7914a62213ec8c911aa8d0b06356
      NODE_ARCHIVE_URL: https://nodejs.org/dist/v24.20.0/node-v24.20.0-win-x64.zip
      NODE_ARCHIVE_SHA256: 6cac9ffbca8f6a47091e4b5c772e0606049c3871cb67d900c0cedde630e545ba
      PREVIOUS_INSTALLER_URL: https://github.com/kktbur/Live-stream-recording-Automatic-monitoring/releases/download/v0.2.0/RecoBox-Setup-0.2.0.exe
      PREVIOUS_INSTALLER_SHA256: 93ef84724582837e66a78c57e6da6d4eb7a4363171a4dbdf2129d1cbd01929bc

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Check uv lockfile
        shell: pwsh
        run: uv lock --check

      - name: Install project and development dependencies
        shell: pwsh
        run: uv sync --locked --extra dev

      - name: Read project version
        id: project-version
        shell: pwsh
        run: |
          $version = (& uv run --locked python tools/project_version.py).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read the project version from pyproject.toml"
          }
          $packageVersion = (& uv run --locked python -c "import reco_box; print(reco_box.__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $packageVersion -ne $version) {
            throw "Python package version mismatch: expected $version, got $packageVersion"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "PROJECT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Prepare verified FFmpeg runtime
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg-runtime.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg-runtime"
          Invoke-WebRequest -Uri $env:FFMPEG_ARCHIVE_URL -OutFile $archivePath

          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FFMPEG_ARCHIVE_SHA256) {
            throw "FFmpeg archive SHA-256 mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath
          $ffmpeg = Get-ChildItem -LiteralPath $extractPath -Recurse -Filter "ffmpeg.exe" |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw "Verified archive did not contain ffmpeg.exe"
          }

          $runtimeDir = Resolve-Path "runtime/ffmpeg"
          Copy-Item -Path (Join-Path $ffmpeg.DirectoryName "*") -Destination $runtimeDir -Force

      - name: Prepare verified Node.js runtime
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "node-runtime.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "node-runtime"
          Invoke-WebRequest -Uri $env:NODE_ARCHIVE_URL -OutFile $archivePath
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:NODE_ARCHIVE_SHA256) {
            throw "Node.js archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath
          New-Item -ItemType Directory -Force -Path "runtime/node" | Out-Null
          Copy-Item -LiteralPath (Join-Path $extractPath "node-v24.20.0-win-x64/node.exe") -Destination "runtime/node/node.exe"
          Copy-Item -LiteralPath (Join-Path $extractPath "node-v24.20.0-win-x64/LICENSE") -Destination "runtime/node/LICENSE.txt"

      - name: Prepare pinned previous release installer
        shell: pwsh
        run: |
          $previousInstaller = Join-Path $env:RUNNER_TEMP "RecoBox-Setup-0.2.0.exe"
          Invoke-WebRequest -Uri $env:PREVIOUS_INSTALLER_URL -OutFile $previousInstaller
          $actualHash = (Get-FileHash -LiteralPath $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:PREVIOUS_INSTALLER_SHA256) {
            throw "Previous installer SHA-256 mismatch: $actualHash"
          }
          "PREVIOUS_INSTALLER_PATH=$previousInstaller" >> $env:GITHUB_ENV

      - name: Check first-party source
        shell: pwsh
        run: uv run --locked ruff check src tests tools

      - name: Run tests
        shell: pwsh
        run: uv run --locked pytest tests -q -p no:cacheprovider

      - name: Build Windows application
        shell: pwsh
        run: pwsh -NoProfile -File packaging/build.ps1

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "reco-box-self-test"
          $env:RECO_BOX_DATA_DIR = $dataDir
          $exe = Resolve-Path "dist/Reco Box/RecoBox.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged self-test exited with code $($process.ExitCode)"
          }

          $reportPath = Join-Path $dataDir "self-check.json"
          if (-not (Test-Path -LiteralPath $reportPath)) {
            throw "Packaged self-test did not create $reportPath"
          }

          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if (-not $report.passed) {
            throw "Packaged self-test report did not pass"
          }

          $internalDir = "dist/Reco Box/_internal"
          $conflicts = Get-ChildItem -LiteralPath $internalDir -File | Where-Object {
            $_.Name -match '^(icu|api-ms-win-|ucrtbase|MSVCP140)'
          }
          if ($conflicts) {
            throw "Conflicting root runtime DLLs were packaged: $($conflicts.Name -join ', ')"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare pinned Inno Setup language files
        shell: pwsh
        run: |
          $commit = "cfdf48923178df4b4f040e038b423aa555a61ffc"
          $languageDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/Languages"
          $files = @{
            "ChineseSimplified.isl" = "Unofficial/ChineseSimplified.isl"
            "ChineseTraditional.isl" = "Unofficial/ChineseTraditional.isl"
            "Spanish.isl" = "Spanish.isl"
            "French.isl" = "French.isl"
            "German.isl" = "German.isl"
            "Portuguese.isl" = "Portuguese.isl"
            "Russian.isl" = "Russian.isl"
            "Japanese.isl" = "Japanese.isl"
            "Korean.isl" = "Korean.isl"
          }
          foreach ($entry in $files.GetEnumerator()) {
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/$commit/Files/Languages/$($entry.Value)"
            Invoke-WebRequest -Uri $url -OutFile (Join-Path $languageDir $entry.Key)
          }

      - name: Build ten-language installer and checksum
        shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/build_installer.ps1
          $installerName = "RecoBox-Setup-$env:PROJECT_VERSION.exe"
          $installer = Resolve-Path "dist/installer/$installerName"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content -Encoding ascii "$installer.sha256.txt"
          pwsh -NoProfile -File tools/check_version_consistency.ps1 -ExecutablePath "dist/Reco Box/RecoBox.exe" -InstallerPath $installer.Path

      - name: Run installer install, upgrade, and uninstall smoke
        shell: pwsh
        run: pwsh -NoProfile -File tools/test_installer.ps1 -PreviousInstallerPath $env:PREVIOUS_INSTALLER_PATH

      - name: Upload installer test artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: RecoBox-Setup-${{ steps.project-version.outputs.version }}
          path: |
            dist/installer/RecoBox-Setup-${{ steps.project-version.outputs.version }}.exe
            dist/installer/RecoBox-Setup-${{ steps.project-version.outputs.version }}.exe.sha256.txt
