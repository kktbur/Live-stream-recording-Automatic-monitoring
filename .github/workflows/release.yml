name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build, attest, and publish, for example v0.2.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release assets
    uses: ./.github/workflows/ci.yml
    with:
      upload_artifact: true
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
    permissions:
      contents: read

  attest-release:
    name: Attest release installer
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release asset
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: RecoBox-Setup-*
          path: release-artifact
          merge-multiple: true

      - name: Verify release asset checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t installers < <(find release-artifact -maxdepth 1 -type f -name 'RecoBox-Setup-*.exe' -print)
          mapfile -t checksums < <(find release-artifact -maxdepth 1 -type f -name 'RecoBox-Setup-*.exe.sha256.txt' -print)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one release installer, found ${#installers[@]}" >&2
            exit 1
          fi
          if (( ${#checksums[@]} != 1 )); then
            echo "Expected exactly one installer checksum, found ${#checksums[@]}" >&2
            exit 1
          fi
          installer="${installers[0]}"
          checksum="${checksums[0]}"
          read -r expected_hash expected_name < "$checksum"
          if [[ "$expected_name" != "$(basename "$installer")" ]]; then
            echo "Checksum filename does not match the installer" >&2
            exit 1
          fi
          actual_hash="$(sha256sum "$installer" | awk '{print $1}')"
          if [[ "${expected_hash,,}" != "$actual_hash" ]]; then
            echo "Release installer SHA-256 mismatch" >&2
            exit 1
          fi

      - name: Generate binary provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ github.workspace }}/release-artifact/RecoBox-Setup-*.exe

  publish-release:
    name: Publish GitHub Release
    needs: attest-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Download release asset
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: RecoBox-Setup-*
          path: release-artifact
          merge-multiple: true

      - name: Create and publish release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a plain semantic version such as v0.2.1" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          installer="release-artifact/RecoBox-Setup-${version}.exe"
          checksum="${installer}.sha256.txt"
          if [[ ! -f "$installer" || ! -f "$checksum" ]]; then
            echo "Release assets do not match the requested tag: $RELEASE_TAG" >&2
            exit 1
          fi
          read -r expected_hash expected_name < "$checksum"
          if [[ "$expected_name" != "$(basename "$installer")" ]]; then
            echo "Checksum filename does not match the installer" >&2
            exit 1
          fi
          actual_hash="$(sha256sum "$installer" | awk '{print $1}')"
          if [[ "${expected_hash,,}" != "$actual_hash" ]]; then
            echo "Release installer SHA-256 mismatch" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace an existing GitHub Release: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$installer" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Reco Box $RELEASE_TAG" \
            --generate-notes
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
