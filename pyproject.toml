[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reco-box"
version = "0.2.0"
description = "Reco Box - local Windows livestream recorder UI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "PySide6>=6.8,<7",
  "platformdirs>=4.3,<5",
  "requests>=2.31,<3",
  "loguru>=0.7.3,<1",
  "pycryptodome>=3.20,<4",
  "distro>=1.9,<2",
  "tqdm>=4.67,<5",
  "httpx[http2]>=0.28.1,<1",
  "PyExecJS>=1.5.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "PyInstaller>=6.11,<7",
  "Pillow>=11,<12",
  "PyYAML>=6.0,<7",
]

[project.scripts]
reco-box = "reco_box.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reco_box = ["ui/*.qml", "translations/*.qm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
